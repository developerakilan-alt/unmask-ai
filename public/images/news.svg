<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#08120C"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#00FF88" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ee"/>
      <stop offset="1" stop-color="#c9d3cb"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="500" height="350" fill="url(#bg)"/>
  <circle cx="400" cy="70" r="220" fill="url(#glow)"/>

  <g filter="url(#blur)">
    <ellipse cx="140" cy="300" rx="170" ry="70" fill="#00FF88" opacity="0.08"/>
  </g>

  <g transform="rotate(-4 250 180)">
    <rect x="90" y="70" width="320" height="230" rx="8" fill="url(#paper)"/>
    <rect x="112" y="96" width="276" height="3" fill="#1a1f1b" opacity="0.9"/>
    <rect x="112" y="108" width="190" height="10" rx="2" fill="#111"/>
    <rect x="112" y="128" width="276" height="4" fill="#3a403b" opacity="0.55"/>
    <rect x="112" y="140" width="250" height="4" fill="#3a403b" opacity="0.45"/>
    <rect x="112" y="152" width="268" height="4" fill="#3a403b" opacity="0.45"/>
    <rect x="112" y="164" width="200" height="4" fill="#3a403b" opacity="0.35"/>

    <rect x="112" y="182" width="120" height="76" rx="3" fill="#8d968f"/>
    <polygon points="192,214 232,196 232,242" fill="#5f6a62"/>
    <rect x="240" y="186" width="148" height="5" fill="#2a2f2b" opacity="0.85"/>
    <rect x="240" y="198" width="136" height="4" fill="#4a504b" opacity="0.55"/>
    <rect x="240" y="208" width="148" height="4" fill="#4a504b" opacity="0.5"/>
    <rect x="240" y="218" width="120" height="4" fill="#4a504b" opacity="0.45"/>
    <rect x="240" y="228" width="140" height="4" fill="#4a504b" opacity="0.45"/>
    <rect x="240" y="238" width="100" height="4" fill="#4a504b" opacity="0.35"/>

    <rect x="112" y="272" width="276" height="3" fill="#1a1f1b" opacity="0.9"/>
  </g>

  <g transform="translate(340 44)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#00FF88" opacity="0.14" stroke="#00FF88" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="18" cy="15" r="6" fill="#00FF88"/>
    <text x="80" y="20" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#00FF88">LIVE</text>
  </g>

  <g transform="translate(60 316)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#00FF88" opacity="0.1" stroke="#00FF88" stroke-opacity="0.4" stroke-width="1"/>
    <text x="75" y="17" text-anchor="middle" font-family="monospace" font-size="11" fill="#00FF88" opacity="0.9">VERIFY SOURCE</text>
  </g>
